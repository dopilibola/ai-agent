# teamworks.uz — the Django admin panel (django_admin/, 127.0.0.1:8200).
#
# Its own server block rather than a location under an existing site: the panel
# is internal and the other sites on this box are customer-facing, and mixing
# them would mean one bad nginx edit can take down both.
#
# Install:
#   sudo cp deploy/teamworks.uz.nginx.conf /etc/nginx/sites-available/teamworks.uz
#   sudo ln -s /etc/nginx/sites-available/teamworks.uz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d teamworks.uz      # adds the TLS block + redirect
server {
    listen 80;
    listen [::]:80;
    server_name teamworks.uz www.teamworks.uz;

    # Public, login-free pages. Meta's App Review will not accept an app with no
    # privacy policy, and a deletion route has to be reachable by someone who is
    # not a customer — so these three sit outside the panel's auth, and only
    # these three: exact matches, above the catch-all that requires a login.
    # Source lives in deploy/public/; copy it to /var/www/teamworks/ on deploy.
    location = /privacy       { alias /var/www/teamworks/privacy.html; default_type text/html; }
    location = /terms         { alias /var/www/teamworks/terms.html; default_type text/html; }
    location = /data-deletion { alias /var/www/teamworks/data-deletion.html; default_type text/html; }

    # Meta (WhatsApp/Instagram/Messenger) posts inbound messages here. An exact
    # match, above the panel's catch-all: this one path is public API, the rest
    # of the host is a staff-only panel, and the two must not be confused.
    location = /meta/webhook {
        proxy_pass http://127.0.0.1:58240;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # The panel serves its own static files (WhiteNoise), so there is nothing
    # for nginx to serve from disk — one proxy_pass is the whole config.
    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django checks this against CSRF_TRUSTED_ORIGINS on every POST; without
        # it every form on the panel fails behind TLS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # A CSV export of a few thousand chats is the largest thing this serves.
    client_max_body_size 16m;
}
