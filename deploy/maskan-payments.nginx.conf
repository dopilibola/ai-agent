# Public HTTPS front for the Maskan payment callbacks (`maskan-payments-api`).
#
# Payme and Uzum only call public HTTPS endpoints, and they retry — so this has
# to be a stable hostname with a real certificate. Deliberately a SEPARATE
# server block on its own subdomain rather than a location inside the
# app.mas-kan.uz site: the Maskan Django production must stay untouched.
#
# Install (on the server, once a DNS A record points the name here):
#   sudo cp deploy/maskan-payments.nginx.conf /etc/nginx/sites-available/maskan-pay
#   sudo ln -s /etc/nginx/sites-available/maskan-pay /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pay.example.uz          # issues + wires the TLS cert
#
# Then register these URLs in the merchant cabinets:
#   Payme Merchant API endpoint : https://pay.example.uz/payme
#   Uzum callbacks              : https://pay.example.uz/uzum/check
#                                 https://pay.example.uz/uzum/create
#                                 https://pay.example.uz/uzum/confirm
#                                 https://pay.example.uz/uzum/reverse

server {
    listen 80;
    listen [::]:80;
    server_name pay.example.uz;   # <-- replace with the real hostname

    # Providers post small JSON bodies; nothing here needs uploads.
    client_max_body_size 64k;

    access_log /var/log/nginx/maskan-pay.access.log;
    error_log  /var/log/nginx/maskan-pay.error.log;

    location / {
        proxy_pass http://127.0.0.1:58230;   # MASKAN_PAYMENTS_API_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The Authorization header is the providers' only credential — it must
        # survive the hop.
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }
}
