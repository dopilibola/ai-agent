# Payment callbacks for the ai-sales bot, served from the existing mas-kan.uz
# host instead of a new subdomain.
#
# Why here and not app.mas-kan.uz: same machine, different application.
# `app.mas-kan.uz` proxies to 127.0.0.1:8010 — Maskan's own FastAPI, with its
# own database and its own orders. A callback that lands there is looked up
# among *their* orders and can never settle one of our invoices. Our payment
# process is 127.0.0.1:58230, reading the ai-sales Postgres.
#
# Why not a new pay.* subdomain: mas-kan.uz already resolves to this server and
# already has a valid certificate, and the two paths below are currently dead
# on this host — `POST /api/payme/merchant/` returns a bare 302 to `/`. So this
# displaces nothing and needs no DNS change.
#
# Scope is deliberately narrow: exact-match locations, so every other path on
# mas-kan.uz keeps going to the marketing site on :8009, and app.mas-kan.uz is
# not touched at all.
#
# ── Install ──────────────────────────────────────────────────────────────────
#   sudo cp /etc/nginx/sites-available/mas-kan.uz /root/mas-kan.uz.bak
#   sudoedit /etc/nginx/sites-available/mas-kan.uz
#       → paste the two location blocks below INSIDE the `listen 443 ssl`
#         server block, immediately BEFORE its `location / {` line
#   sudo nginx -t && sudo systemctl reload nginx
#
# ── Then register in the merchant cabinets ───────────────────────────────────
#   Payme  endpoint : https://mas-kan.uz/api/payme/merchant/
#   Uzum   callbacks: https://mas-kan.uz/api/uzum/check
#                     https://mas-kan.uz/api/uzum/create
#                     https://mas-kan.uz/api/uzum/confirm
#                     https://mas-kan.uz/api/uzum/reverse

    location = /api/payme/merchant/ {
        proxy_pass http://127.0.0.1:58230/payme;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The Authorization header is the providers' only credential — it must
        # survive the hop.
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30;
    }

    location ~ ^/api/uzum/(check|create|confirm|reverse)$ {
        proxy_pass http://127.0.0.1:58230/uzum/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30;
    }
