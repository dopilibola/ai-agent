[project]
name = "ai-sales"
version = "0.1.0"
description = "Multi-tenant Telegram AI sales agent platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Agent runtime — both langchain and langgraph went 1.x in early 2026;
    # floors pin to current majors so resolver can't drop back to 0.x APIs.
    "langchain>=1.3.0",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.0",
    "langchain-groq>=1.1.2",
    "langchain-google-genai>=4.2.6",
    "langgraph>=1.2.0",
    "langgraph-checkpoint>=4.1.0",
    # LLM / embeddings / transcription
    "litellm>=1.85.0",
    "openai>=2.37.0",
    # Vector search
    "chromadb>=1.5.9",
    "sentence-transformers>=5.5.0",
    # Telegram — exact pin: MTProto changes occasionally break sessions
    "telethon==1.43.2",
    # HTTP
    "httpx>=0.28.1",
    # Image
    "pillow>=12.2.0",
    # Excel + Word ingestion (anfa clinic service-catalog + doctor-roster exports)
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    # PDF generation (BYD Stage-6 booking voucher)
    "reportlab>=4.2.0",
    # Validation
    "pydantic>=2.13.0",
    # Misc
    "python-dotenv>=1.2.0",
    # Persistence — optional Postgres backend (opt-in via DATABASE_URL; unset =
    # JSON files + in-memory checkpointer). SQLAlchemy 2.x async + psycopg3 (one
    # driver serves both the ORM and the LangGraph PostgresSaver); Alembic owns
    # the runtime-state schema. `uv lock` resolves langgraph-checkpoint-postgres
    # to the build matching langgraph 1.x.
    "sqlalchemy>=2.0.36",
    "greenlet>=3.1.0",
    "psycopg[binary,pool]>=3.2.0",
    "alembic>=1.14.0",
    "langgraph-checkpoint-postgres>=2.0",
]

[project.optional-dependencies]
# Internal admin panel API. Kept out of the base deps so a bot-only deploy
# (`uv sync`) stays lean; install with `uv sync --extra admin`. The panel is a
# separate process that only reads/writes the shared Postgres — it imports none
# of the Telegram/agent runtime.
admin = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "itsdangerous>=2.2.0",
    # Multipart form parsing for the anfa catalog Excel upload (UploadFile).
    "python-multipart>=0.0.18",
]

[project.scripts]
oygul-customer = "apps.oygul.customer:run"
oygul-merchant = "apps.oygul.merchant:run"
anfa-all = "apps.anfa.main:run"
anfa-bot = "apps.anfa.main:run_bot"
anfa-userbot = "apps.anfa.main:run_userbot"
anfa-sync = "apps.anfa.main:run_sync"
byd-all = "apps.byd.main:run"
byd-userbot = "apps.byd.main:run_userbot"
byd-operator = "apps.byd.main:run_operator"
maskan-all = "apps.maskan.main:run"
maskan-userbot = "apps.maskan.main:run_userbot"
maskan-operator = "apps.maskan.main:run_operator"
admin-api = "admin.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["admin", "apps", "channels", "core", "db", "notifications", "rag", "sync", "voice"]
