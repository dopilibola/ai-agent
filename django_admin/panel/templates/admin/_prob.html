{% comment %}
The buy probability: a bar and the number. Included wherever a chat is listed
so the same person reads the same way on every page. The reasons ride in the
tooltip — the score is only useful if it can be checked without a click.
{% endcomment %}
<span class="prob" title="{% for label, points in row.reasons %}{{ label }}: {{ points }}&#10;{% endfor %}">
  <span class="prob-track"><i style="width:{{ row.bar_width }}%;background:{{ row.segment_obj.color }}"></i></span>
  <b>{{ row.percent }}%</b>
</span>
